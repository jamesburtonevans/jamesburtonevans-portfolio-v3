      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #282828;
        --fg: #f1e9dd;
        --muted: #a69b8c;
        --accent: #8f8e1a;
        --line: #4c4343;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Roboto", sans-serif;
        line-height: 1.6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      main { width: 100%; max-width: 560px; text-align: center; }
      .eq {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 6px;
        height: 56px;
        margin-bottom: 32px;
      }
      .eq span {
        width: 8px;
        background: var(--accent);
        border-radius: 2px;
        height: 20%;
        animation: bounce 1.2s ease-in-out infinite;
      }
      .eq span:nth-child(2) { animation-delay: -1.0s; }
      .eq span:nth-child(3) { animation-delay: -0.8s; }
      .eq span:nth-child(4) { animation-delay: -0.6s; }
      .eq span:nth-child(5) { animation-delay: -0.4s; }
      .eq span:nth-child(6) { animation-delay: -0.2s; }
      @keyframes bounce {
        0%, 100% { height: 50%; }
        50% { height: 100%; }
      }
      .label {
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.75rem;
        color: var(--accent);
        margin: 0 0 12px;
      }
      h1 {
        font-family: Roboto, sans-serif;
        font-weight: 600;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.15;
        margin: 0 0 16px;
      }
      p.lead { color: var(--muted); margin: 0 0 32px; }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        margin-bottom: 40px;
      }
      .links a {
        color: var(--fg);
        text-decoration: none;
        border: 1px solid var(--line);
        padding: 8px 16px;
        border-radius: 5px;
        font-weight: 500;
        transition: border-color 0.15s, color 0.15s;
      }
      .links a:hover, .links a:focus-visible { border-color: var(--accent); color: var(--accent); }
      .links a.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
      .links a.primary:hover, .links a.primary:focus-visible { background: transparent; color: var(--accent); }
      footer { border-top: 1px solid var(--line); padding-top: 20px; font-size: 0.875rem; color: var(--muted); }
      footer a { color: var(--muted); }
      footer a:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="eq" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="label">Under construction</p>
      <h1>Music scoring &amp; production, coming soon.</h1>
      <p class="lead">
        I'm putting together a home for my original music, scoring work and production services.
        In the meantime, I'm always happy to talk about a project.
      </p>
      <div class="links">
        <a class="primary" href="mailto:james@jamesburtonevans.com?subject=Music%20inquiry">Get in touch</a>
        <a href="/">Design & development portfolio</a>
      </div>
      <footer>
        James Burton Evans - Raleigh, NC
      </footer>
    </main>
  </body>
</html>
